<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Sumber 3 Waterfall</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <a class="brand" href="index.html"><span class="brand-mark">S<span>3</span></span><span class="brand-name">SUMBER 3<small>WATERFALL</small></span></a>
    <button class="hamburger" id="hamburger" aria-label="Buka menu">☰</button>
    <nav id="navMenu">

        <a href="gallery.html" class="active">Galeri</a>

<section class="page-heading">
    <div class="page-heading-inner">
        <p class="eyebrow">03 — OUR MOMENTS</p>
        <h1>Galeri Wisata</h1>
        <p class="page-sub">Keindahan Sumber 3 Waterfall dalam gambar dan video.</p>

        <div class="gallery-nav">
            <button class="gallery-tab active" data-filter="all">Semua</button>
            <button class="gallery-tab" data-filter="foto">Foto</button>
            <button class="gallery-tab" data-filter="video">Video</button>
        </div>
    </div>
</section>

<!-- FOTO -->
<section class="content-section" id="foto-section">
    <h2>Foto Wisata</h2>
    <div class="gallery-grid">
        <img src="Img/foto1.jpg" alt="Foto wisata 1">

        <img src="Img/foto4.jpg" alt="Foto wisata 4">
        <img src="Img/foto5.jpg" alt="Foto wisata 5">

        <img src="Img/foto7.jpg" alt="Foto wisata 7">
        <img src="Img/foto8.jpg" alt="Foto wisata 8">
        <img src="Img/foto9.jpg" alt="Foto wisata 9">
        <img src="Img/foto10.jpg" alt="Foto wisata 10">
        <img src="Img/foto11.jpg" alt="Foto wisata 11">
        <img src="Img/foto12.jpg" alt="Foto wisata 12">
    </div>
</section>

<!-- VIDEO -->
<section class="content-section" id="video-section">
    <h2>Video Wisata</h2>
    <div class="video-container">
        <video controls>
            <source src="Img/video-wisata.mp4" type="video/mp4">
            Browser tidak mendukung video.
        </video>
    </div>

    <div class="next-section">
        <a href="profile.html" class="btn btn-light">← Kembali</a>
